<!DOCTYPE html>
<html>
<head>
    <title>VroomHub</title>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    {% load static %}
    {% load humanize %}

    <style>
        body {
            min-height: 100vh;
            background: url("{% static 'images/logo.png' %}") no-repeat center center fixed;
            background-size: cover;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-color: rgba(255,255,255,0.4);
            z-index: -1;
        }

        /* Mobile improvements */
        body {
            overflow-x: hidden;
        }

        .card {
            border-radius: 14px;
        }

        @media (max-width: 768px) {
            .btn {
                width: 100%;
                margin-bottom: 8px;
            }

            .navbar .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<!-- ✅ MOBILE FRIENDLY NAVBAR -->
<nav class="navbar navbar-expand-md navbar-dark bg-dark shadow-sm">
    <div class="container-fluid px-3">

        <a class="navbar-brand fw-bold" href="{% url 'browse_listings' %}">
            VroomHub
        </a>

        <!-- Hamburger button -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Collapsible menu -->
        <div class="collapse navbar-collapse" id="mainNav">

            <div class="ms-auto d-flex flex-column flex-md-row gap-2">

                {% if user.is_authenticated %}

                    <a href="{% url 'manage_ads' %}" class="btn btn-outline-light btn-sm">My Ads</a>

                    <a href="{% url 'post_listing' %}" class="btn btn-success btn-sm">Post Ad</a>

                    <a href="{% url 'seller_profile' user_id=user.id %}" class="btn btn-info btn-sm">Profile</a>

                    {% if user.profile.is_verified %}
                        <span class="badge bg-success align-self-center">Verified</span>
                    {% else %}
                        <a href="{% url 'get_verified' %}" class="btn btn-outline-info btn-sm">Get Verified</a>
                    {% endif %}

                    {% if user.is_staff %}
                        <a href="/admin/" class="btn btn-warning btn-sm">Admin</a>
                    {% endif %}

                    <a href="{% url 'logout' %}" class="btn btn-danger btn-sm">Logout</a>

                {% else %}

                    <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm">Login</a>

                    <a href="{% url 'register' %}" class="btn btn-success btn-sm">Register</a>

                {% endif %}

            </div>
        </div>
    </div>
</nav>

<!-- ✅ FULL WIDTH CONTENT -->
<div class="container-fluid px-3 mt-3">
    {% block content %}{% endblock %}
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
