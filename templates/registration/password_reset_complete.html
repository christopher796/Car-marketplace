{% extends "base.html" %}
{% block content %}
{% load static %}

<style>
    /* =========================================
       PASSWORD RESET SUCCESS — DARK NAVY / GOLD LUXURY THEME
       Matching Chrandi Motors design system
    ========================================= */

    .success-wrapper {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--navy);
        padding: 2rem 1rem;
        position: relative;
        overflow: hidden;
    }

    /* Animated background elements */
    .success-wrapper::before {
        content: '🎉';
        position: absolute;
        top: 10%;
        left: 5%;
        font-size: 8rem;
        opacity: 0.02;
        animation: float 6s ease-in-out infinite;
        pointer-events: none;
    }

    .success-wrapper::after {
        content: '🔑';
        position: absolute;
        bottom: 10%;
        right: 5%;
        font-size: 8rem;
        opacity: 0.02;
        animation: float 8s ease-in-out infinite reverse;
        pointer-events: none;
    }

    @keyframes float {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-20px) rotate(5deg); }
    }

    /* Subtle radial gradient background */
    .success-wrapper::before {
        content: '';
        position: absolute;
        top: -20%;
        right: -10%;
        width: 500px;
        height: 500px;
        background: radial-gradient(circle, rgba(201,168,76,0.05) 0%, transparent 70%);
        border-radius: 50%;
        z-index: 0;
        pointer-events: none;
    }

    .success-wrapper::after {
        content: '';
        position: absolute;
        bottom: -20%;
        left: -10%;
        width: 400px;
        height: 400px;
        background: radial-gradient(circle, rgba(201,168,76,0.03) 0%, transparent 70%);
        border-radius: 50%;
        z-index: 0;
        pointer-events: none;
    }

    /* Floating particles */
    .particle {
        position: absolute;
        font-size: 1.5rem;
        opacity: 0.05;
        animation: floatRandom 15s linear infinite;
        pointer-events: none;
    }

    @keyframes floatRandom {
        0% { transform: translate(0, 0) rotate(0deg); }
        100% { transform: translate(80px, -80px) rotate(360deg); }
    }

    .particle-1 { top: 20%; left: 20%; animation-delay: 0s; }
    .particle-2 { top: 70%; left: 80%; animation-delay: 3s; }
    .particle-3 { top: 40%; left: 60%; animation-delay: 6s; }
    .particle-4 { top: 80%; left: 30%; animation-delay: 9s; }

    /* Main card */
    .success-card {
        background: var(--navy-card);
        backdrop-filter: blur(10px);
        border-radius: 24px;
        padding: 3rem 2.5rem;
        max-width: 550px;
        width: 100%;
        box-shadow: var(--shadow-card);
        border: 1px solid var(--border-soft);
        position: relative;
        z-index: 10;
        animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        text-align: center;
        transition: all 0.3s ease;
    }

    .success-card:hover {
        border-color: var(--border);
        box-shadow: var(--shadow-card), var(--shadow-glow);
    }

    @keyframes popIn {
        0% {
            opacity: 0;
            transform: scale(0.9) translateY(20px);
        }
        100% {
            opacity: 1;
            transform: scale(1) translateY(0);
        }
    }

    /* Success icon */
    .success-icon {
        width: 100px;
        height: 100px;
        background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.5rem;
        box-shadow: 0 10px 25px rgba(201,168,76,0.3);
        animation: gentlePulse 2s ease infinite;
    }

    @keyframes gentlePulse {
        0%, 100% { transform: scale(1); box-shadow: 0 10px 25px rgba(201,168,76,0.3); }
        50% { transform: scale(1.05); box-shadow: 0 15px 35px rgba(201,168,76,0.4); }
    }

    .success-icon i {
        font-size: 3rem;
        color: var(--navy);
    }

    /* Confetti effect - subtle gold particles */
    .confetti {
        position: absolute;
        width: 6px;
        height: 6px;
        background: var(--gold);
        opacity: 0.4;
        animation: confetti 4s ease-out infinite;
        pointer-events: none;
    }

    @keyframes confetti {
        0% { transform: translateY(-100px) rotate(0deg); opacity: 0; }
        10% { opacity: 0.5; }
        100% { transform: translateY(400px) rotate(720deg); opacity: 0; }
    }

    .confetti-1 { left: 10%; background: var(--gold); animation-delay: 0s; }
    .confetti-2 { left: 30%; background: var(--gold-light); animation-delay: 0.5s; }
    .confetti-3 { left: 50%; background: var(--gold-dim); animation-delay: 1s; }
    .confetti-4 { left: 70%; background: var(--gold); animation-delay: 1.5s; }
    .confetti-5 { left: 90%; background: var(--gold-light); animation-delay: 2s; }

    /* Card content */
    .success-title {
        font-size: 2.2rem;
        font-weight: 600;
        color: var(--white);
        margin-bottom: 1rem;
        letter-spacing: -0.5px;
        position: relative;
        display: inline-block;
        font-family: 'DM Sans', sans-serif;
    }

    .success-title span {
        color: var(--gold-light);
        position: relative;
        display: inline-block;
    }

    .success-message {
        font-size: 1rem;
        color: var(--muted);
        margin: 1.2rem 0;
        line-height: 1.6;
    }

    .success-message i {
        color: var(--gold);
        margin: 0 4px;
    }

    /* Checkmark animation */
    .checkmark-container {
        margin: 1.5rem 0;
    }

    .checkmark {
        width: 70px;
        height: 70px;
        border-radius: 50%;
        background: var(--green);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto;
        animation: scaleIn 0.5s ease;
        box-shadow: 0 5px 15px rgba(46,204,138,0.3);
    }

    .checkmark i {
        color: white;
        font-size: 2.5rem;
    }

    @keyframes scaleIn {
        0% { transform: scale(0); }
        70% { transform: scale(1.1); }
        100% { transform: scale(1); }
    }

    /* Features list */
    .feature-list {
        display: flex;
        justify-content: center;
        gap: 1.5rem;
        margin: 1.5rem 0;
        flex-wrap: wrap;
    }

    .feature-item {
        text-align: center;
    }

    .feature-icon {
        width: 45px;
        height: 45px;
        background: rgba(201,168,76,0.1);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 0.5rem;
        border: 1px solid rgba(201,168,76,0.2);
    }

    .feature-icon i {
        color: var(--gold-light);
        font-size: 1.2rem;
    }

    .feature-text {
        font-size: 0.75rem;
        color: var(--muted);
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.04em;
    }

    /* Action buttons */
    .action-buttons {
        display: flex;
        gap: 1rem;
        justify-content: center;
        margin: 2rem 0 1rem;
        flex-wrap: wrap;
    }

    .btn-login {
        background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
        color: var(--navy) !important;
        border: none;
        border-radius: 10px;
        padding: 0.9rem 2rem;
        font-size: 0.9rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        transition: all 0.3s ease;
        box-shadow: var(--shadow-btn);
        min-width: 180px;
        text-decoration: none;
    }

    .btn-login:hover {
        background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 100%);
        transform: translateY(-3px) scale(1.02);
        box-shadow: 0 10px 30px rgba(201,168,76,0.45);
        color: var(--navy) !important;
    }

    .btn-login i {
        font-size: 1rem;
        transition: transform 0.2s ease;
    }

    .btn-login:hover i {
        transform: translateX(4px);
    }

    .btn-home {
        background: transparent;
        color: var(--gold-light) !important;
        border: 1px solid var(--border-soft);
        border-radius: 10px;
        padding: 0.9rem 1.8rem;
        font-size: 0.85rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition: all 0.2s ease;
        text-decoration: none;
    }

    .btn-home:hover {
        background: rgba(201,168,76,0.08);
        border-color: var(--gold);
        color: var(--gold) !important;
        transform: translateY(-2px);
    }

    /* Security note */
    .security-note {
        background: rgba(201,168,76,0.05);
        padding: 0.8rem;
        border-radius: 12px;
        margin-top: 1.5rem;
        border: 1px solid rgba(201,168,76,0.15);
    }

    .security-note i {
        color: var(--gold);
        margin-right: 6px;
    }

    .security-note small {
        color: var(--muted);
        font-size: 0.7rem;
        letter-spacing: 0.02em;
    }

    /* Decorative car emoji */
    .car-emoji {
        margin-top: 1rem;
        font-size: 1.5rem;
        opacity: 0.2;
        letter-spacing: 4px;
    }

    /* Responsive */
    @media (max-width: 768px) {
        .success-wrapper {
            padding: 1rem;
        }

        .success-card {
            padding: 2rem 1.5rem;
            margin: 0 0.75rem;
        }

        .success-title {
            font-size: 1.6rem;
        }

        .success-icon {
            width: 80px;
            height: 80px;
        }

        .success-icon i {
            font-size: 2.2rem;
        }

        .checkmark {
            width: 60px;
            height: 60px;
        }

        .checkmark i {
            font-size: 2rem;
        }

        .action-buttons {
            flex-direction: column;
            gap: 0.8rem;
        }

        .btn-login, .btn-home {
            width: 100%;
            justify-content: center;
        }

        .feature-list {
            gap: 1rem;
        }

        .feature-icon {
            width: 40px;
            height: 40px;
        }

        .feature-icon i {
            font-size: 1rem;
        }

        .feature-text {
            font-size: 0.65rem;
        }

        .particle, .success-wrapper::before, .success-wrapper::after {
            font-size: 4rem;
        }
    }

    @media (max-width: 480px) {
        .success-card {
            padding: 1.5rem 1rem;
        }

        .success-title {
            font-size: 1.4rem;
        }

        .success-message {
            font-size: 0.85rem;
        }

        .feature-list {
            gap: 0.8rem;
        }

        .feature-icon {
            width: 35px;
            height: 35px;
        }

        .feature-icon i {
            font-size: 0.9rem;
        }

        .car-emoji {
            font-size: 1rem;
        }
    }
</style>

<div class="success-wrapper">
    <!-- Confetti elements - subtle gold particles -->
    <div class="confetti confetti-1"></div>
    <div class="confetti confetti-2"></div>
    <div class="confetti confetti-3"></div>
    <div class="confetti confetti-4"></div>
    <div class="confetti confetti-5"></div>

    <!-- Floating particles - subtle decorative -->
    <div class="particle particle-1">✨</div>
    <div class="particle particle-2">🔐</div>
    <div class="particle particle-3">🚗</div>
    <div class="particle particle-4">🔑</div>

    <!-- Main success card -->
    <div class="success-card">
        <!-- Large animated icon -->
        <div class="success-icon">
            <i class="bi bi-check-lg"></i>
        </div>

        <!-- Success title with celebration -->
        <h1 class="success-title">
            <span>Password Reset</span> Successful!
        </h1>

        <!-- Animated checkmark -->
        <div class="checkmark-container">
            <div class="checkmark">
                <i class="bi bi-check2"></i>
            </div>
        </div>

        <!-- Success message -->
        <div class="success-message">
            <i class="bi bi-shield-check"></i>
            Your password has been reset successfully.
            <i class="bi bi-emoji-smile"></i>
        </div>

        <!-- Feature highlights -->
        <div class="feature-list">
            <div class="feature-item">
                <div class="feature-icon">
                    <i class="bi bi-lock-fill"></i>
                </div>
                <div class="feature-text">Secure</div>
            </div>
            <div class="feature-item">
                <div class="feature-icon">
                    <i class="bi bi-lightning-charge-fill"></i>
                </div>
                <div class="feature-text">Instant</div>
            </div>
            <div class="feature-item">
                <div class="feature-icon">
                    <i class="bi bi-check2-circle"></i>
                </div>
                <div class="feature-text">Verified</div>
            </div>
        </div>

        <!-- Action buttons -->
        <div class="action-buttons">
            <a href="{% url 'login' %}" class="btn-login">
                <i class="bi bi-box-arrow-in-right"></i>
                Login Now
            </a>
            <a href="{% url 'browse_listings' %}" class="btn-home">
                <i class="bi bi-house"></i>
                Browse Cars
            </a>
        </div>

        <!-- Security note -->
        <div class="security-note">
            <small>
                <i class="bi bi-info-circle-fill"></i>
                For security, you'll need to log in with your new password
            </small>
        </div>

        <!-- Decorative car emoji -->
        <div class="car-emoji">
            🚗 💨
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        console.log('Password reset successful! 🎉');
    });
</script>
{% endblock %}
