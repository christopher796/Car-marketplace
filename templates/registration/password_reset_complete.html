{% extends "base.html" %}
{% block content %}
{% load static %}

<style>
    .success-wrapper {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, var(--light-gray) 0%, var(--white) 100%);
        padding: 1rem;
        position: relative;
        overflow: hidden;
    }

    /* Animated background elements */
    .success-wrapper::before {
        content: '🎉';
        position: absolute;
        top: 10%;
        left: 5%;
        font-size: 8rem;
        opacity: 0.1;
        animation: float 6s ease-in-out infinite;
    }

    .success-wrapper::after {
        content: '🔑';
        position: absolute;
        bottom: 10%;
        right: 5%;
        font-size: 8rem;
        opacity: 0.1;
        animation: float 8s ease-in-out infinite reverse;
    }

    @keyframes float {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-20px) rotate(5deg); }
    }

    /* Floating particles */
    .particle {
        position: absolute;
        font-size: 2rem;
        opacity: 0.1;
        animation: floatRandom 10s linear infinite;
    }

    @keyframes floatRandom {
        0% { transform: translate(0, 0) rotate(0deg); }
        100% { transform: translate(100px, -100px) rotate(360deg); }
    }

    .particle-1 { top: 20%; left: 20%; animation-delay: 0s; }
    .particle-2 { top: 70%; left: 80%; animation-delay: 2s; }
    .particle-3 { top: 40%; left: 60%; animation-delay: 4s; }
    .particle-4 { top: 80%; left: 30%; animation-delay: 6s; }

    /* Main card */
    .success-card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 50px;
        padding: 3.5rem 2.5rem;
        max-width: 550px;
        width: 100%;
        box-shadow: var(--shadow-lg);
        border: 2px solid rgba(249, 115, 22, 0.1);
        position: relative;
        z-index: 10;
        animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        text-align: center;
    }

    @keyframes popIn {
        0% {
            opacity: 0;
            transform: scale(0.8) translateY(30px);
        }
        100% {
            opacity: 1;
            transform: scale(1) translateY(0);
        }
    }

    /* Success icon */
    .success-icon {
        width: 120px;
        height: 120px;
        background: linear-gradient(135deg, var(--orange-light) 0%, var(--orange) 100%);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 2rem;
        box-shadow: 0 20px 30px rgba(249, 115, 22, 0.3);
        animation: bounce 2s ease infinite;
    }

    @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
    }

    .success-icon i {
        font-size: 4rem;
        color: white;
    }

    /* Confetti effect */
    .confetti {
        position: absolute;
        width: 10px;
        height: 10px;
        background: var(--orange);
        opacity: 0.6;
        animation: confetti 3s ease-out infinite;
    }

    @keyframes confetti {
        0% { transform: translateY(-100px) rotate(0deg); opacity: 0; }
        10% { opacity: 1; }
        100% { transform: translateY(400px) rotate(720deg); opacity: 0; }
    }

    .confetti-1 { left: 10%; background: #F97316; animation-delay: 0s; }
    .confetti-2 { left: 30%; background: #FCD34D; animation-delay: 0.5s; }
    .confetti-3 { left: 50%; background: #F97316; animation-delay: 1s; }
    .confetti-4 { left: 70%; background: #F59E0B; animation-delay: 1.5s; }
    .confetti-5 { left: 90%; background: #F97316; animation-delay: 2s; }

    /* Card content */
    .success-title {
        font-size: 2.8rem;
        font-weight: 800;
        color: var(--charcoal-dark);
        margin-bottom: 1rem;
        letter-spacing: -0.5px;
        position: relative;
        display: inline-block;
    }

    .success-title span {
        color: var(--orange);
        position: relative;
        display: inline-block;
    }

    .success-title span::after {
        content: '';
        position: absolute;
        bottom: 5px;
        left: 0;
        width: 100%;
        height: 8px;
        background: rgba(249, 115, 22, 0.2);
        z-index: -1;
        border-radius: 4px;
    }

    .success-message {
        font-size: 1.2rem;
        color: var(--text-muted);
        margin: 1.5rem 0;
        line-height: 1.6;
    }

    .success-message i {
        color: var(--orange);
        margin: 0 5px;
    }

    /* Checkmark animation */
    .checkmark-container {
        margin: 2rem 0;
    }

    .checkmark {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: #10B981;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto;
        animation: scaleIn 0.5s ease;
    }

    .checkmark i {
        color: white;
        font-size: 3rem;
    }

    @keyframes scaleIn {
        0% { transform: scale(0); }
        70% { transform: scale(1.2); }
        100% { transform: scale(1); }
    }

    /* Features list */
    .feature-list {
        display: flex;
        justify-content: center;
        gap: 2rem;
        margin: 2rem 0;
        flex-wrap: wrap;
    }

    .feature-item {
        text-align: center;
    }

    .feature-icon {
        width: 50px;
        height: 50px;
        background: rgba(249, 115, 22, 0.1);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 0.5rem;
    }

    .feature-icon i {
        color: var(--orange);
        font-size: 1.5rem;
    }

    .feature-text {
        font-size: 0.9rem;
        color: var(--text-muted);
        font-weight: 500;
    }

    /* Action buttons */
    .action-buttons {
        display: flex;
        gap: 1rem;
        justify-content: center;
        margin: 2.5rem 0 1rem;
        flex-wrap: wrap;
    }

    .btn-login {
        background: var(--orange);
        color: white;
        border: none;
        border-radius: 50px;
        padding: 1rem 2.5rem;
        font-size: 1.2rem;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        transition: all 0.3s ease;
        box-shadow: 0 10px 20px rgba(249, 115, 22, 0.3);
        min-width: 200px;
        text-decoration: none;
    }

    .btn-login:hover {
        background: var(--orange-hover);
        transform: translateY(-3px) scale(1.02);
        box-shadow: 0 15px 30px rgba(249, 115, 22, 0.4);
        color: white;
    }

    .btn-login i {
        font-size: 1.3rem;
        transition: transform 0.2s ease;
    }

    .btn-login:hover i {
        transform: translateX(5px);
    }

    .btn-home {
        background: var(--white);
        color: var(--charcoal-dark);
        border: 2px solid var(--light-gray-dark);
        border-radius: 50px;
        padding: 1rem 2rem;
        font-size: 1.1rem;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition: all 0.2s ease;
        text-decoration: none;
    }

    .btn-home:hover {
        background: var(--light-gray-dark);
        transform: translateY(-2px);
    }

    /* Security note */
    .security-note {
        background: linear-gradient(135deg, rgba(249, 115, 22, 0.05) 0%, transparent 100%);
        padding: 1rem;
        border-radius: 30px;
        margin-top: 2rem;
        border: 1px dashed rgba(249, 115, 22, 0.3);
    }

    .security-note i {
        color: var(--orange);
        margin-right: 8px;
    }

    .security-note small {
        color: var(--text-muted);
    }

    /* Responsive */
    @media (max-width: 768px) {
        .success-card {
            padding: 2rem 1.5rem;
        }

        .success-title {
            font-size: 2rem;
        }

        .success-icon {
            width: 100px;
            height: 100px;
        }

        .success-icon i {
            font-size: 3rem;
        }

        .btn-login {
            width: 100%;
            padding: 0.9rem;
        }

        .btn-home {
            width: 100%;
        }

        .particle, .success-wrapper::before, .success-wrapper::after {
            font-size: 4rem;
        }
    }
</style>

<div class="success-wrapper">
    <!-- Confetti elements -->
    <div class="confetti confetti-1"></div>
    <div class="confetti confetti-2"></div>
    <div class="confetti confetti-3"></div>
    <div class="confetti confetti-4"></div>
    <div class="confetti confetti-5"></div>

    <!-- Floating particles -->
    <div class="particle particle-1">✨</div>
    <div class="particle particle-2">🔐</div>
    <div class="particle particle-3">🚗</div>
    <div class="particle particle-4">🔑</div>

    <!-- Main success card -->
    <div class="success-card">
        <!-- Large animated icon -->
        <div class="success-icon">
            <i class="bi bi-check-lg"></i>
        </div>

        <!-- Success title with celebration -->
        <h1 class="success-title">
            <span>Password Reset</span> Successful!
        </h1>

        <!-- Animated checkmark -->
        <div class="checkmark-container">
            <div class="checkmark">
                <i class="bi bi-check2"></i>
            </div>
        </div>

        <!-- Success message -->
        <div class="success-message">
            <i class="bi bi-shield-check"></i>
            Your password has been reset successfully.
            <i class="bi bi-emoji-smile"></i>
        </div>

        <!-- Feature highlights -->
        <div class="feature-list">
            <div class="feature-item">
                <div class="feature-icon">
                    <i class="bi bi-lock-fill"></i>
                </div>
                <div class="feature-text">Secure</div>
            </div>
            <div class="feature-item">
                <div class="feature-icon">
                    <i class="bi bi-lightning-charge-fill"></i>
                </div>
                <div class="feature-text">Instant</div>
            </div>
            <div class="feature-item">
                <div class="feature-icon">
                    <i class="bi bi-check2-circle"></i>
                </div>
                <div class="feature-text">Verified</div>
            </div>
        </div>

        <!-- Action buttons -->
        <div class="action-buttons">
            <a href="{% url 'login' %}" class="btn-login text-dark">
                <i class="bi bi-box-arrow-in-right"></i>
                Login Now
            </a>
            <a href="{% url 'browse_listings' %}" class="btn-home">
                <i class="bi bi-house"></i>
                Browse Cars
            </a>
        </div>

        <!-- Security note -->
        <div class="security-note">
            <small>
                <i class="bi bi-info-circle-fill"></i>
                For security, you'll need to log in with your new password
            </small>
        </div>

        <!-- Optional: Add a fun car emoji -->
        <div style="margin-top: 1rem; font-size: 2rem; opacity: 0.2;">
            🚗 💨
        </div>
    </div>
</div>

<!-- Add some JavaScript for extra flair -->
<script>
    // Add more confetti on load (optional)
    document.addEventListener('DOMContentLoaded', function() {
        console.log('Password reset successful! 🎉');
        
        // You could trigger actual confetti here if you have a library
        // For now, just a console celebration
    });
</script>
{% endblock %}
